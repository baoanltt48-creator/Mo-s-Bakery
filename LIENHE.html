<style>

body{
    margin:0;

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:#e6d5c3;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu a{
    margin:0 15px;
    text-decoration:none;
    color:#8C6A54;
    position:relative;
}

.menu a:hover{
    color:red;
}

.menu a::after{
    content:"";
    position:absolute;
    bottom:-5px;
    left:0;
    width:0;
    height:2px;
    background:red;
    transition:0.3s;
}

.menu a:hover::after{
    width:100%;
}

/* BANNER */
.banner{
    overflow:hidden;
    padding:20px 0;
}

.banner-track{
    display:flex;
    width:max-content;
    animation:slide 20s linear infinite;
}

.banner:hover .banner-track{
    animation-play-state:paused;
}

.banner img{
    width:300px;
    height:400px;
    object-fit:cover;
    margin:0 10px;
    border:6px solid #fff;
    border-radius:15px;
    transform:rotate(-3deg);
    transition:0.2s;
}

.banner img:hover{
    transform:scale(1.35) rotate(0deg);
    z-index:10;
}

@keyframes slide{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

/* CONTACT */
.contact-section{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:40px;
    padding:60px 10%;
}

.contact-info{

}

.contact-info h2{

    margin-bottom:20px;
}

.contact-info p{
    margin:10px 0;
    color:#6e4b3a;
}

.contact-form{
    flex:1;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.contact-form h3{
    text-align:center;
    margin-bottom:20px;
    font-family:'Playfair Display';
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#e6d5c3;
    font-family:'Poppins', sans-serif;
}

.contact-form button{
    width:100%;
    padding:12px;
    background:#c94f4f;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;

/* FOOTER */

}

.social i{

<!-- JS -->
<script>

function sendForm(e){

    e.preventDefault();

    // lấy form
    const form = document.getElementById("contactForm");

    // tạo thông báo
    const msg = document.createElement("div");

    msg.innerText = "✔ Đã gửi liên hệ!";

    msg.style = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #8C6A54;
        color: white;
        padding: 15px 30px;
        border-radius: 12px;
        font-size: 16px;
        z-index: 999;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    `;

    document.body.appendChild(msg);

    // reset form
    form.reset();

    // tự ẩn thông báo
    setTimeout(() => {

        msg.remove();

    }, 2000);

}

</script>
